server {
    listen 80;
    server_name mialfaizein.web.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mialfaizein.web.id;

    ssl_certificate /etc/letsencrypt/live/mialfaizein.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mialfaizein.web.id/privkey.pem;

    location /api/ {
        proxy_pass http://server:3001/api/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public";
    }
}