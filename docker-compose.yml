version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: presensi_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: presensi_app
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    build: ./back-end
    container_name: presensi_api
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./back-end:/app
      - /app/node_modules
    env_file:
      - ./back-end/.env
    depends_on:
      - db
      - face-service

  face-service:
    build: ./face-service
    container_name: face_service
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./face-service:/app

  frontend:
    build: ./front-end
    container_name: presensi_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./front-end:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - server
    command: npm start

volumes:
  db_data: